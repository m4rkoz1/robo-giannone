services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giannone
      POSTGRES_PASSWORD: giannone123
      POSTGRES_DB: giannone
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://giannone:giannone123@db:5432/giannone
      SECRET_KEY: ${SECRET_KEY:-giannone_dev_secret_trocar_em_producao}
    volumes:
      - app_data:/app/data
    depends_on:
      - db

volumes:
  pgdata:
  app_data:
