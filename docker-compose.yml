services:
  # Opção 1: Postgres (RECOMENDADO - nunca perde dados)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giannone
      POSTGRES_PASSWORD: giannone123
      POSTGRES_DB: giannone
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Descomente para usar Postgres (recomendado):
      DATABASE_URL: postgresql://giannone:giannone123@db:5432/giannone
      # SQLITE_PATH: /app/data/giannone.db  # usado se DATABASE_URL não estiver setado
    volumes:
      # Persiste SQLite caso não use Postgres
      - app_data:/app/data
    depends_on:
      - db

  # Opção 2: Se quiser rodar APENAS com SQLite (sem Postgres), use:
  # docker compose up app -- sem o serviço db, e remova DATABASE_URL acima

volumes:
  pgdata:
  app_data:
